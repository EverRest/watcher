name: Release

# Push a tag like v0.1.0. The full CI gate (all PHP versions, coverage) must pass first;
# only then is the GitHub Release created. The "last successful release" README badge reads
# the latest GitHub Release, so a tag whose gate failed never shows up there.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release with the built-in GITHUB_TOKEN, no other secret
      attestations: write   # build provenance for the release archive
      id-token: write       # OIDC token for the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Release guards: each stops the run with one line before anything is released.
      # A tag pushed from an unreviewed branch, or one left behind by a newer main, must not become a release.
      - name: Guard tag still points at the commit this run was started for
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: scripts/check-release.sh pinned "$GITHUB_REF_NAME"
      - name: Guard tag is annotated
        run: scripts/check-release.sh annotated "$GITHUB_REF_NAME"
      - name: Guard tag commit is the tip of origin/main
        run: scripts/check-release.sh tip "$GITHUB_REF_NAME"
      - name: Guard VERSION matches the tag
        run: scripts/check-release.sh version "$GITHUB_REF_NAME"
      - name: Guard CHANGELOG has the version heading
        run: scripts/check-release.sh changelog "$GITHUB_REF_NAME"
      - name: Build release archive
        run: git archive --format=tar.gz --prefix="watcher-${GITHUB_REF_NAME}/" -o "watcher-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_SHA"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: watcher-${{ github.ref_name }}.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" "watcher-${GITHUB_REF_NAME}.tar.gz" "${flags[@]}"
