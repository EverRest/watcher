name: CI

on:
  push:
    branches: ['**']   # tags are gated by release.yml, which calls this workflow
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo_sqlite, redis
          coverage: none
      - id: cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-
      - run: composer validate --strict
        if: matrix.php == '8.3'
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked
        if: matrix.php == '8.3'
      - run: composer test
        env:
          WATCHER_TEST_REDIS: 127.0.0.1:6379
      - run: composer stan
        if: matrix.php == '8.3'
      - run: composer style
        if: matrix.php == '8.3'

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_sqlite
          coverage: pcov
      - id: cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: composer-cov-${{ hashFiles('composer.lock') }}
          restore-keys: composer-cov-
      - run: composer install --no-interaction --prefer-dist
      - run: composer coverage
      - run: cat build/coverage/summary.txt | tail -n 12 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build/coverage/cobertura.xml
            build/coverage/clover.xml
            build/coverage/summary.txt
            build/coverage/html
