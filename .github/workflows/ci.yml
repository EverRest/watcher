name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo_sqlite, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked
        if: matrix.php == '8.3'
      - run: composer test
        env:
          WATCHER_TEST_REDIS: 127.0.0.1:6379
      - run: composer stan
        if: matrix.php == '8.3'
      - run: composer style
        if: matrix.php == '8.3'
