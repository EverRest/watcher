name: CI

on:
  push:
    branches: ['**']   # tags are gated by release.yml, which calls this workflow
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [locked]   # the main matrix runs on composer.lock
        include:
          # Consumers ignore our lock: also test the oldest and the newest versions composer.json admits.
          - { php: '8.2', deps: lowest }
          - { php: '8.5', deps: highest }
    services:
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo_sqlite, redis
          coverage: none
      - id: cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.lock') }}
      - run: composer validate --strict
        if: matrix.php == '8.3' && matrix.deps == 'locked'
      - run: composer install --no-interaction --prefer-dist
        if: matrix.deps == 'locked'
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
        if: matrix.deps == 'lowest'
      - run: composer update --prefer-stable --no-interaction --prefer-dist
        if: matrix.deps == 'highest'
      - run: composer audit --locked
        if: matrix.php == '8.3' && matrix.deps == 'locked'
      # Runtime requirements must be advisory-free at their floor; dev tools at their floor may not be.
      - run: composer audit --no-dev
        if: matrix.deps != 'locked'
      - run: composer test
        env:
          WATCHER_TEST_REDIS: 127.0.0.1:6379
      - run: composer stan
        if: (matrix.php == '8.3' && matrix.deps == 'locked') || matrix.deps == 'highest'   # highest resolves Guzzle 8
      - run: composer style
        if: (matrix.php == '8.3' && matrix.deps == 'locked') || matrix.deps == 'highest'   # highest resolves Guzzle 8

  coverage:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_sqlite, redis
          coverage: pcov
      - id: cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: composer-cov-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: composer coverage
        env:
          WATCHER_TEST_REDIS: 127.0.0.1:6379
      - run: php scripts/coverage-floor.php 92
      - run: cat build/coverage/summary.txt | tail -n 12 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          retention-days: 7
          path: |
            build/coverage/cobertura.xml
            build/coverage/clover.xml
            build/coverage/summary.txt
            build/coverage/html
